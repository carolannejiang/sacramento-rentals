<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sacramento Rentals</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>Sacramento Rentals</h1>
    <p id="meta">Loading…</p>
    <p class="sync-row"><span id="syncStatus" class="sync off"></span> <button id="syncBtn" class="link-btn" type="button">Sign in</button></p>
    <form id="syncForm" class="sync-form" hidden>
      <input id="syncName" type="text" autocomplete="username" placeholder="Your name" aria-label="Your name" maxlength="30">
      <input id="syncInput" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode">
      <button type="submit">Sign in</button>
      <button type="button" id="syncCancel" class="link-btn">Cancel</button>
    </form>
  </div>
  <nav class="tabs" role="tablist">
    <button data-view="all" class="active">All</button>
    <button data-view="fav">Saved <span id="favCount"></span></button>
    <button data-view="messaged">Contacted <span id="messagedCount"></span></button>
    <button data-view="hidden">Hidden <span id="hiddenCount"></span></button>
    <select id="markedBy" aria-label="Whose saved and contacted listings to show" hidden></select>
  </nav>
</header>

<section class="filters">
  <label>Max rent <input id="maxPrice" type="number" step="50" value="2500"></label>
  <label>Min beds
    <select id="minBeds"><option value="0">Any</option><option value="1">1+</option><option value="2" selected>2+</option><option value="3">3+</option></select>
  </label>
  <label>Home type
    <select id="homeType"><option value="any">Any</option><option value="apartment">Apartment / studio</option><option value="house">House</option><option value="condo">Condo / townhouse</option><option value="duplex">Duplex</option></select>
  </label>
  <label>Min sqft <input id="minSqft" type="number" step="50" placeholder="Any"></label>
  <label>Dogs
    <select id="dogs"><option value="maybe" selected>OK or not stated</option><option value="yes">Must say OK</option><option value="any">Any</option></select>
  </label>
  <label>Listed by
    <select id="listedBy"><option value="any">Anyone</option><option value="individual">Individual (owner or tenant)</option><option value="company">Company / property manager</option></select>
  </label>
  <label>Walkability
    <select id="minWalk"><option value="0">Any</option><option value="25">Somewhat walkable+</option><option value="50">Walkable+</option><option value="70">Very walkable</option></select>
  </label>
  <label>Posted
    <select id="postedWithin"><option value="0">Any time</option><option value="1">Last 24 hours</option><option value="3">Last 3 days</option><option value="7">Last week</option><option value="14">Last 2 weeks</option><option value="30">Last 30 days</option></select>
  </label>
  <label>Sort
    <select id="sort"><option value="newest">Newest</option><option value="priceAsc">Price ↑</option><option value="priceDesc">Price ↓</option><option value="walk">Most walkable</option></select>
  </label>
  <span id="driveFilters" class="drive-filters"></span>
  <label class="grow">Search <input id="q" type="search" placeholder="Midtown, parking, washer…"></label>
  <fieldset id="sources"><legend>Sources</legend></fieldset>
  <label class="check"><input id="newOnly" type="checkbox"> New since last visit</label>
  <label class="check"><input id="noPrice" type="checkbox" checked> Include no-price</label>
  <label class="check"><input id="hideHotels" type="checkbox" checked> Hide weekly hotels</label>
  <label class="check"><input id="hideFlagged" type="checkbox"> Hide possible scams</label>
</section>

<main>
  <div id="map" aria-label="Map of listings"></div>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Drag to resize map and list" tabindex="0"></div>
  <div class="results">
    <p id="count" class="count"></p>
    <ul id="list"></ul>
  </div>
</main>

<footer id="keybar" class="keybar" aria-label="Keyboard shortcuts">
  Hit <kbd>↑</kbd><kbd>↓</kbd> to move between listings <span class="dot">·</span>
  <kbd>←</kbd><kbd>→</kbd> for photos <span class="dot">·</span>
  <kbd>S</kbd> to star <span class="dot">·</span>
  <kbd>X</kbd> to hide
</footer>

<div id="lightbox" hidden role="dialog" aria-label="Photo viewer">
  <button id="lbClose" class="lb-close" aria-label="Close">×</button>
  <button id="lbPrev" class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button id="lbNext" class="lb-nav lb-next" aria-label="Next photo">›</button>
  <span id="lbCount" class="lb-count"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="app.js"></script>
</body>
</html>
