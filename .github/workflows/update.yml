name: Update listings

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force_zillow:
        description: "Pull Zillow even if it ran in the last 3 days"
        type: boolean
        default: false
      craigslist_detail_limit:
        description: "Max new Craigslist detail pages to fetch (about 1 per second)"
        type: string
        default: "300"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Working data (raw pulls, Craigslist page cache, sorted Facebook posts) lives in the
      # Actions cache, not the repo, so poster names never land in public git history.
      - name: Restore data
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Start from seed when the cache is empty
        if: steps.restore.outputs.cache-matched-key == ''
        run: cp -R seed/data .

      - name: Run pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CL_DETAIL_LIMIT: ${{ inputs.craigslist_detail_limit }}
        run: python scripts/run_pipeline.py ${{ inputs.force_zillow && '--force-zillow' || '' }}

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      # Make browsers fetch the new code after each deploy instead of a cached copy.
      - name: Version static files
        run: sed -i "s/\(app\.js\|style\.css\)\"/\1?v=${GITHUB_SHA::7}\"/g" site/index.html

      - name: Deploy to Vercel
        continue-on-error: true  # a Vercel problem shouldn't stop the GitHub Pages publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set; skipping"; exit 0; fi
          npx --yes vercel@58.9.1 deploy site --prod --yes --token "$(printf %s "$VERCEL_TOKEN" | tr -d '[:space:]')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages sometimes can't see the artifact uploaded a moment ago ("No artifacts named
      # github-pages were found"), so give it time, and try once more if it still fails.
      - run: sleep 15

      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
