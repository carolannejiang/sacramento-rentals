name: Update listings

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force_zillow:
        description: "Pull Zillow even if it ran in the last 3 days"
        type: boolean
        default: false
      craigslist_detail_limit:
        description: "Max new Craigslist detail pages to fetch (about 1 per second)"
        type: string
        default: "300"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Working data (raw pulls, Craigslist page cache, sorted Facebook posts) lives in the
      # Actions cache, not the repo, so poster names never land in public git history.
      - name: Restore data
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Start from seed when the cache is empty
        if: steps.restore.outputs.cache-matched-key == ''
        run: cp -R seed/data .

      - name: Run pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CL_DETAIL_LIMIT: ${{ inputs.craigslist_detail_limit }}
        run: python scripts/run_pipeline.py ${{ inputs.force_zillow && '--force-zillow' || '' }}

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set; skipping"; exit 0; fi
          npx --yes vercel@58.9.1 deploy site --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
